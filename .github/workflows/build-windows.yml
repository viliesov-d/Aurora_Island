name: Build Windows installer
on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "feat/island-toolbox-2026-11-15", "feat/visual-refresh-crisp-glass-magnetic-20261115", "feat/atoll-core-mechanics-20261115", "fix/window-chrome-transparent-smooth-20261115", "feat/native-audio-hud-live-events-20261115", "refactor/stable-window-motion-magnetic-v2-20261115"]
  push:
    branches: ["main"]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - name: Install NSIS
        run: choco install nsis -y
      - run: npm ci
      - run: npm test
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-island-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
