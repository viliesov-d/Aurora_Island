[package]
name = "aurora-island"
version = "0.1.0"
description = "Lightweight Dynamic Island for Windows"
authors = ["Aurora Island contributors"]
edition = "2021"

[lib]
name = "aurora_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
window-vibrancy = "0.8.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory"] }
winreg = "0.52"
windows = { version = "0.62.2", features = [
  "Foundation", "Foundation_Collections", "Media_Control",
  "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage"
] }
